# Copy of the recipe submitted to https://gitlab.com/fdroid/fdroiddata
# (metadata/id.imtaqin.cfmobile.yml), merge request 51555. The copy in fdroiddata is the one that counts.

AntiFeatures:
  NonFreeNet:
    en-US: Needs a Cloudflare account; optional AI features use a non-free backend
Categories:
  - Internet
  - System
License: MIT
AuthorName: imtaqin
WebSite: https://github.com/imtaqin/CFMobile
SourceCode: https://github.com/imtaqin/CFMobile
IssueTracker: https://github.com/imtaqin/CFMobile/issues

AutoName: CloudFlare Mobile

RepoType: git
Repo: https://github.com/imtaqin/CFMobile.git

Builds:
  - versionName: 1.7.0
    versionCode: 451
    commit: 78359d96daf1ee2c7bfe0547d07c717397179883
    subdir: android/app
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - echo -e "\norg.gradle.jvmargs=-Xms1g -Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8
        -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
      - sdkmanager 'cmake;3.22.1'
      - sed -i -e 's/"main":.*/&\n  "expo":{"autolinking":{"android":{"buildFromSource":[".*"]}}},/'
        package.json
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - node_modules/react-native/sdks/hermesc
      - node_modules/react-native/React/I18n
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-svg/android/build.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
    scandelete:
      - node_modules
    ndk: 27.1.12297006
    gradleprops:
      - reactNativeArchitectures=armeabi-v7a

